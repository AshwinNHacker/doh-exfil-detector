[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doh-exfil-detector"
version = "1.0.0"
description = "Fingerprints anomalous DNS-over-HTTPS (DoH) query patterns from packet metadata, without decrypting TLS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ashwin N" }
]
keywords = ["dns", "doh", "dns-over-https", "network-security", "anomaly-detection", "exfiltration", "threat-hunting", "pcap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "scapy>=2.5.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[project.scripts]
doh-detector = "doh_detector.cli:main"

[project.urls]
Homepage = "https://github.com/AshwinNHacker/doh-exfil-detector"
Issues = "https://github.com/AshwinNHacker/doh-exfil-detector/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doh_detector = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
